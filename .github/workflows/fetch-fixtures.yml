name: Fetch upcoming fixtures

on:
  workflow_dispatch:
    inputs:
      week_start:
        description: 'Monday of the week (dd/mm/yyyy). Leave blank for next Monday.'
        required: false
  schedule:
    - cron: '0 8 * * 0'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch fixtures from FA Full-Time
        env:
          WEEK_START: ${{ inputs.week_start }}
        run: |
          if [ -n "$WEEK_START" ]; then
            python3 scripts/fetch_fixtures.py --start "$WEEK_START" | tee fixtures.txt
          else
            python3 scripts/fetch_fixtures.py | tee fixtures.txt
          fi
          { echo '### Home fixtures'; echo '```'; cat fixtures.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          rm fixtures.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upcoming-fixtures.csv
          git diff --cached --quiet && exit 0
          git commit -m "Update upcoming fixtures"
          git push
