<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Weekly Pitch Allocations - Hart Youth FC</title>
  <style>
    :root {
      --ink: #17202a;
      --muted: #64707d;
      --paper: #f5f7f9;
      --panel: #ffffff;
      --line: #d9e0e7;
      --red: #b71c1c;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--paper); font-family: Georgia, 'Times New Roman', serif; }
    .page { max-width: 1100px; margin: 0 auto; padding: 1rem 1rem 2rem; }
    .masthead { border-bottom: 3px solid var(--red); padding-bottom: 1rem; }
    .eyebrow { margin: 0 0 .35rem; color: var(--red); font: 700 .78rem/1.2 Arial, sans-serif; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(1.6rem, 4vw, 2.2rem); letter-spacing: .02em; }
    .week-pick { display: block; margin-top: .4rem; font-size: 1.1rem; }
    .week-pick select { margin-left: .4rem; padding: .3rem .5rem; border: 1px solid #bfc9d4; border-radius: 5px; background: white; color: var(--ink); font: 1rem Arial, sans-serif; }
    nav { display: flex; flex-wrap: wrap; gap: .35rem; margin: .75rem 0; }
    #results { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: .75rem; align-items: start; }
    nav button { padding: .4rem .8rem; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; color: var(--red); font: 700 .85rem Arial, sans-serif; cursor: pointer; }
    nav button:hover, nav button[aria-pressed='true'] { background: var(--red); color: white; }
    tr.hl td { background: #fff3b0; }
    section { margin: 0; padding: .6rem .75rem; background: var(--panel); border-left: 5px solid var(--red); border-radius: 5px; box-shadow: 0 2px 6px rgba(23,32,42,.06); }
    h2 { margin: 0 0 .3rem; font-size: 1.15rem; }
    h3 { margin: .6rem 0 .15rem; color: var(--red); font: 700 .78rem Arial, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
    h2 + h3 { margin-top: 0; }
    table { width: 100%; border-collapse: collapse; font: .9rem Arial, sans-serif; }
    th { text-align: left; padding: .2rem .4rem; color: var(--muted); font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; border-bottom: 2px solid var(--line); }
    td { padding: .25rem .4rem; border-bottom: 1px solid var(--line); }
    tr:last-child td { border-bottom: 0; }
    td.ko { width: 3.5rem; font-weight: 700; color: var(--red); white-space: nowrap; }
    td.fmt { width: 3.5rem; color: var(--muted); white-space: nowrap; }
    .none, .status { margin: 0; color: var(--muted); font: italic .95rem Arial, sans-serif; }
    .status.error { color: var(--red); font-style: normal; font-weight: 700; }
    footer { margin-top: 1rem; color: var(--muted); font: .8rem Arial, sans-serif; }
    @media (max-width: 600px) { #results { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="page">
    <header class="masthead">
      <p class="eyebrow">Hart Youth FC</p>
      <h1>Weekly pitch allocations</h1>
      <label class="week-pick">Week commencing <select id="weekSelect"></select></label>
    </header>

    <nav id="ageNav" aria-label="Highlight an age group"></nav>
    <p id="status" class="status" role="status">Loading pitch allocations...</p>
    <div id="results"></div>

    <footer>Allocations are subject to change. Please check this page again before travelling.</footer>
  </main>

  <script>
    // Edited weekly by the pitch allocations person.
    const csvPath = 'weekly-pitch-allocations.csv';
    const venues = ['Basingbourne', 'Ancells', 'Frogmore', 'Cambridge School', 'Zebon Copse', 'Alderwood', 'Garrison'];
    const status = document.getElementById('status');
    const results = document.getElementById('results');
    const nav = document.getElementById('ageNav');
    const weekSelect = document.getElementById('weekSelect');
    const seasonStart = Date.UTC(2026, 7, 31);
    const seasonEnd = Date.UTC(2027, 5, 28);
    const DAY = 86400000;

    function parseCsv(text) {
      const rows = [];
      let row = [], cell = '', quoted = false;
      for (let i = 0; i < text.length; i += 1) {
        const c = text[i];
        if (c === '"') {
          if (quoted && text[i + 1] === '"') { cell += '"'; i += 1; } else { quoted = !quoted; }
        } else if (c === ',' && !quoted) {
          row.push(cell.trim()); cell = '';
        } else if ((c === '\n' || c === '\r') && !quoted) {
          if (c === '\r' && text[i + 1] === '\n') i += 1;
          row.push(cell.trim()); rows.push(row); row = []; cell = '';
        } else {
          cell += c;
        }
      }
      if (cell || row.length) { row.push(cell.trim()); rows.push(row); }
      return rows.filter(r => r.some(v => v));
    }

    // Accepts dd/mm/yyyy, dd.mm.yyyy, dd-mm-yyyy or yyyy-mm-dd.
    function parseDate(value) {
      let m = value.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);
      if (m) return new Date(Date.UTC(+m[3], +m[2] - 1, +m[1]));
      m = value.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      return m ? new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])) : null;
    }

    // Format is worked out from the age group at the start of the fixture, e.g. "U9 Stormers".
    function format(text) {
      const m = text.match(/^U(\d+)\b/i);
      if (!m) return '';
      const age = +m[1];
      if (age <= 7) return '3v3';
      if (age <= 9) return '5v5';
      if (age <= 11) return '7v7';
      if (age <= 13) return '9v9';
      return '11v11';
    }

    function ageGroup(text) {
      const m = text.match(/^U\d+\b/i);
      return m ? m[0].toUpperCase() : '';
    }

    function highlight(age, pressed) {
      nav.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(!!age && b.textContent === age && pressed)));
      results.querySelectorAll('tr[data-age]').forEach(tr => tr.classList.toggle('hl', !!age && pressed && tr.dataset.age === age));
    }

    function fmt(date, opts) {
      return date.toLocaleDateString('en-GB', { timeZone: 'UTC', ...opts });
    }

    function el(tag, text, className) {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      if (className) node.className = className;
      return node;
    }

    const mondayOf = time => time - ((new Date(time).getUTCDay() + 6) % 7) * DAY;

    function render(rows) {
      const header = rows.shift().map(h => h.toLowerCase());
      const col = name => header.indexOf(name);
      const [iDate, iVenue, iTime, iFixture] = ['date', 'venue', 'kick-off', 'fixture'].map(col);
      if ([iDate, iVenue, iTime, iFixture].includes(-1)) throw new Error('CSV needs columns: Date, Venue, Kick-off, Fixture');

      const fixtures = rows.map(r => ({ date: parseDate(r[iDate] || ''), venue: r[iVenue], time: r[iTime], text: r[iFixture] }))
        .filter(f => f.date && f.venue);
      if (!fixtures.length) throw new Error('No fixtures found in the CSV file');

      const weeks = [];
      const firstWeek = Math.min(seasonStart, mondayOf(Math.min(...fixtures.map(f => f.date))));
      const lastWeek = Math.max(seasonEnd, mondayOf(Math.max(...fixtures.map(f => f.date))));
      for (let w = firstWeek; w <= lastWeek; w += 7 * DAY) weeks.push(w);
      weeks.forEach(w => {
        const opt = el('option', fmt(new Date(w), { day: 'numeric', month: 'long', year: 'numeric' }));
        opt.value = w;
        weekSelect.append(opt);
      });

      // Default to this week, or the next week that has fixtures, else the latest week with fixtures.
      const thisWeek = mondayOf(Date.now());
      const withFixtures = new Set(fixtures.map(f => mondayOf(f.date.getTime())));
      const upcoming = [...withFixtures].filter(w => w >= thisWeek).sort((a, b) => a - b)[0];
      weekSelect.value = upcoming ?? Math.max(...withFixtures);

      const names = [...venues];
      fixtures.forEach(f => { if (!names.some(n => n.toLowerCase() === f.venue.toLowerCase())) names.push(f.venue); });

      weekSelect.onchange = () => showWeek(fixtures, names);
      showWeek(fixtures, names);
      status.hidden = true;
    }

    function showWeek(allFixtures, names) {
      const week = +weekSelect.value;
      const fixtures = allFixtures.filter(f => mondayOf(f.date.getTime()) === week);
      results.replaceChildren();
      nav.replaceChildren();
      if (!fixtures.length) {
        results.append(el('p', 'No pitch allocation data available for this week, check back later.', 'none'));
        return;
      }
      names.forEach((name, i) => {
        const section = el('section');
        section.append(el('h2', name));
        const mine = fixtures.filter(f => f.venue.toLowerCase() === name.toLowerCase());
        const days = [...new Set(mine.map(f => f.date.getTime()))].sort((a, b) => a - b);
        if (!days.length) section.append(el('p', 'No fixtures this week.', 'none'));

        days.forEach(day => {
          const date = new Date(day);
          const girls = date.getUTCDay() === 0 ? ' (Girls)' : '';
          section.append(el('h3', fmt(date, { weekday: 'long', day: 'numeric', month: 'long' }) + girls));
          const table = el('table');
          const head = table.createTHead().insertRow();
          head.append(el('th', 'Kick-off'), el('th', 'Fixture'), el('th', 'Format'));
          const body = table.createTBody();
          mine.filter(f => f.date.getTime() === day).sort((a, b) => a.time.localeCompare(b.time)).forEach(f => {
            const tr = body.insertRow();
            tr.dataset.age = ageGroup(f.text);
            tr.append(el('td', f.time, 'ko'), el('td', f.text), el('td', format(f.text), 'fmt'));
          });
          section.append(table);
        });
        results.append(section);
      });

      const ages = [...new Set(fixtures.map(f => ageGroup(f.text)).filter(Boolean))].sort((a, b) => a.slice(1) - b.slice(1));
      ages.forEach(age => {
        const btn = el('button', age);
        btn.type = 'button';
        btn.setAttribute('aria-pressed', 'false');
        btn.addEventListener('click', () => highlight(age, btn.getAttribute('aria-pressed') !== 'true'));
        nav.append(btn);
      });
    }

    fetch(csvPath, { cache: 'no-store' })
      .then(r => { if (!r.ok) throw new Error('Could not load ' + csvPath); return r.text(); })
      .then(text => render(parseCsv(text)))
      .catch(err => {
        status.textContent = err.message + '. If opening this file directly from your computer, view it via the website instead.';
        status.className = 'status error';
      });
  </script>
</body>
</html>
